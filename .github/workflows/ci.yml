name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allsport
          POSTGRES_PASSWORD: allsport_dev_pw
          POSTGRES_DB: all_sport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allsport -d all_sport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://allsport:allsport_dev_pw@localhost:5432/all_sport

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate database (from empty)
        run: pnpm db:migrate

      - name: Verify schema
        run: pnpm db:verify

      - name: Integration tests (PostgreSQL)
        run: pnpm test:integration

      - name: Build
        run: pnpm build
